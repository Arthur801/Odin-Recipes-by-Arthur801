<body>
    <h1>Tomato Juice</h1>
    <a href = "../index.html">Home</a>
    <img src = "../Images/tomato juice.jpg" alt = "tomato juice image" width="500px" height="500px">
    <h1>Description</h1>
    <p>Tomato juice is a refreshing drink made from fresh tomatoes.</p>
    <h1>Ingredients</h1>
    <ul>
        <li>1 tomato</li>
        <li>1/2 cup water</li>
    </ul>
    <h1>Steps</h1>
    <ol>
        <li>Cut the tomato into quarters.</li>
        <li>Place the tomato quarters in a blender.</li>
        <li>Add the water to the blender.</li>
        <li>Blend the mixture until smooth.</li>
    </ol>
</body>
