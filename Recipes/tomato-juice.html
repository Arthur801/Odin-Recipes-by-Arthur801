<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>tomato juice</title>
    <link rel="stylesheet" href="../style.css">
</head>
<body class="body">
    <h1 class="bigTitle">Tomato Juice</h1>
    <a href = "../index.html">Home</a><br>
    <img src = "../Images/tomato juice.jpg" alt = "tomato juice image" width="500px" height="500px">
    <h1 class="innerTitleh1">Description</h1>
    <p>Tomato juice is a refreshing drink made from fresh tomatoes.</p>
    <h1 class="innerTitleh1">Ingredients</h1>
    <ul class="ingredients">
        <li>1 tomato</li>
        <li>1/2 cup water</li>
    </ul>
    <h1 class="innerTitleh1">Steps</h1>
    <ol class="steps">
        <li>Cut the tomato into quarters.</li>
        <li>Place the tomato quarters in a blender.</li>
        <li>Add the water to the blender.</li>
        <li>Blend the mixture until smooth.</li>
    </ol>
</body>
